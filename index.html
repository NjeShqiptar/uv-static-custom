<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LupineVault v2</title>
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/browser.css">
    
    <script src="uv/uv.bundle.js" defer></script>
    <script src="uv/uv.config.js" defer></script>

    <script>
        window.addEventListener('load', async () => {
            if ('serviceWorker' in navigator) {
                await navigator.serviceWorker.register('./uv/uv.sw.js', {
                    scope: '/service/'
                });
            }
        });

        function launchProxy(event) {
            event.preventDefault();
            const input = document.getElementById('url-input');
            let url = input.value.trim();

            if (!url.includes('.') || url.includes(' ')) {
                url = `https://www.google.com/search?q=${encodeURIComponent(url)}`;
            } else if (!(url.startsWith('https://') || url.startsWith('http://'))) {
                url = `https://${url}`;
            }

            // This line creates the actual proxy link
            const encodedUrl = __uv$config.prefix + __uv$config.encodeUrl(url);
            
            // This displays the site inside the iframe on your page
            document.getElementById('uv-iframe').src = encodedUrl;
            document.getElementById('uv-iframe').style.display = 'block';
        }
    </script>
    <style>
        body { background: #111; color: white; margin: 0; font-family: sans-serif; overflow: hidden; }
        #uv-iframe { border: none; width: 100vw; height: calc(100vh - 100px); display: none; background: white; }
        .sidebar-container { height: 100px; background: #1a1a1a; display: flex; align-items: center; padding: 0 20px; }
        #url-input { width: 400px; padding: 10px; border-radius: 5px; border: none; background: #333; color: white; }
    </style>
</head>
<body>
    <div class="sidebar-container">
        <form onsubmit="launchProxy(event)">
            <input type="text" id="url-input" placeholder="Search or enter URL" autocomplete="off">
        </form>
    </div>
    <iframe id="uv-iframe"></iframe>
</body>
</html>
