<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LupineVault v2</title>
    
    <script src="check.js" defer></script>
    <script defer src="scripts/lstimer.js"></script>

    <link rel="stylesheet" href="style/global.css" />
    <link rel="stylesheet" href="style/browser.css" />
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/vanjs-org/van/public/van-1.5.2.nomodule.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <script src="uv/uv.bundle.js" defer></script>
    <script src="uv/uv.config.js" defer></script>

    <script>
      window.addEventListener('load', async () => {
        if ('serviceWorker' in navigator) {
          try {
            await navigator.serviceWorker.register('./uv/uv.sw.js', {
              scope: '/service/' 
            });
            console.log("Engine: Connected");
          } catch (err) {
            console.error("Engine: Failed", err);
          }
        }
      });
    </script>

    <script src="scripts/tabs.mjs" type="module" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/gh/tf7software/Font-Awesome-pro-cdn@main/js/all.js"></script>
    <style>body {padding: 0;margin: 0;}</style>
  </head>

  <body>
    <div id="small-screen-overlay">Please use a larger screen.</div>
    <div id="nav"></div>
    <div id="main-content"></div>
    <div id="tab-view"></div>
    <div class="sidebar-container">
      <header>
        <div class="page-data">
          <span id="controls">
            <button onclick="window.location.href='/'">
              <svg width="38.454208mm" height="24.726074mm" viewBox="0 0 38.454208 24.726074"><g transform="translate(-145.0951,-136.5279)"><text style="font-size:32.9681px;font-family:Krungthep;fill:#5a32e3;" x="142.33917" y="161.25397">v2</text></g></svg>
              <p class="tooltip">Home</p>
            </button>
            <span>
              <button id="page-back"><ion-icon name="arrow-back-outline"></ion-icon></button>
              <button id="page-forward"><ion-icon name="arrow-forward-outline"></ion-icon></button>
              <button id="page-refresh"><ion-icon name="refresh-outline"></ion-icon></button>
              <button id="options-btn"><ion-icon name="menu-outline"></ion-icon></button>
            </span>
          </span>
          <form id="url-form">
            <input type="text" id="url-input" placeholder="Search or enter URL" autocomplete="off" />
          </form>
          <button id="new-tab"><ion-icon name="add-outline"></ion-icon><span>New Tab</span></button>
        </div>
        <div id="tab-list"></div>
      </header>
    </div>
    <div id="menu-overlay">
      <div class="option" id="devtools-option">Developer Tools</div>
      <div class="option" id="abc-option">Open in about:blank</div>
      <div class="option" id="git-option">GitHub</div>
    </div>
    <script>
      const optionsBtn = document.getElementById("options-btn");
      const overlay = document.getElementById("menu-overlay");
      optionsBtn.addEventListener("click", () => overlay.classList.toggle("active"));
    </script>
  </body>
</html>
