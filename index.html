<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LupineVault v2</title>

    <!-- Ultraviolet core -->
    <script src="./uv/uv.bundle.js" defer></script>
    <script src="./uv/uv.config.js" defer></script>

    <script>
        // Register the proxy engine
        window.addEventListener('load', async () => {
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('./uv/uv.sw.js', {
                        scope: './'
                    });
                    console.log("Proxy Engine: Ready");
                } catch (err) {
                    console.error("Proxy Engine: Failed", err);
                }
            }
        });

        // Launch proxy
        function launchProxy(event) {
            event.preventDefault();
            const input = document.getElementById('url-input');
            let url = input.value.trim();

            if (!url) return;

            // Convert searches to Google
            if (!url.includes('.') || url.includes(' ')) {
                url = `https://www.google.com/search?q=${encodeURIComponent(url)}`;
            } else if (!url.startsWith('https://') && !url.startsWith('http://')) {
                url = `https://${url}`;
            }

            const encodedUrl = __uv$config.prefix + __uv$config.encodeUrl(url);

            const frame = document.getElementById('uv-iframe');
            frame.src = encodedUrl;
            frame.style.display = 'block';
            document.getElementById('home-ui').style.display = 'none';
        }
    </script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f0f0f; font-family: sans-serif; color: white; overflow: hidden; }
        #nav-bar { height: 60px; background: #1a1a1a; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #333; }
        #url-input { background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px 15px; border-radius: 8px; width: 400px; outline: none; }
        #url-input:focus { border-color: #5a32e3; }
        #home-ui { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 60px); }
        .logo { font-size: 50px; font-weight: bold; color: #5a32e3; margin-bottom: 20px; }
        #uv-iframe { width: 100%; height: calc(100vh - 60px); border: none; display: none; background: white; }
    </style>
</head>
<body>

    <div id="nav-bar">
        <div style="color: #5a32e3; font-weight: bold; margin-right: 20px; cursor: pointer;" onclick="location.reload()">v2</div>
        <form onsubmit="launchProxy(event)">
            <input type="text" id="url-input" placeholder="Search or enter URL..." autocomplete="off">
        </form>
    </div>

    <div id="home-ui">
        <div class="logo">LupineVault</div>
        <p>Type a URL above to start unblocking.</p>
    </div>

    <iframe id="uv-iframe"></iframe>

</body>
</html>
